{
  "schema": "agent-guild-model-benchmark-v3",
  "strategies": {
    "astra_only": {
      "root": {"model": "gpt-6-astra", "reasoning_effort": "high"},
      "implementation": {"mode": "root"},
      "risk_review": {"mode": "risk_based", "model": "gpt-6-astra", "reasoning_effort": "xhigh"}
    },
    "astra_luna": {
      "root": {"model": "gpt-6-astra", "reasoning_effort": "high"},
      "implementation": {"mode": "adaptive", "model": "gpt-5.6-luna", "reasoning_effort": "max"},
      "risk_review": {"mode": "risk_based", "model": "gpt-6-astra", "reasoning_effort": "xhigh"}
    }
  },
  "tasks": [
    {
      "id": "pilot-installer-conflict",
      "split": "pilot",
      "objective": "Diagnose and fix a managed-file update conflict without losing user edits.",
      "features": ["installer", "conflict", "preservation"],
      "risk": "high",
      "review_required": true,
      "acceptance": ["conflict reproduced", "user edit preserved", "targeted checks pass"]
    },
    {
      "id": "pilot-boundary-negative",
      "split": "pilot",
      "objective": "Add a negative test for a repository-boundary escape.",
      "features": ["validation", "path-boundary", "negative-test"],
      "risk": "low",
      "review_required": false,
      "acceptance": ["escape rejected", "valid root accepted", "test passes"]
    },
    {
      "id": "holdout-cross-file-change",
      "split": "holdout",
      "objective": "Implement a bounded change spanning code, documentation, and validation.",
      "features": ["cross-file", "documentation", "validation"],
      "risk": "medium",
      "review_required": false,
      "acceptance": ["behavior works", "docs match", "relevant validation passes"]
    },
    {
      "id": "holdout-security-review",
      "split": "holdout",
      "objective": "Review a Git helper change for scope and snapshot bypasses.",
      "features": ["security", "Git", "snapshot"],
      "risk": "high",
      "review_required": true,
      "acceptance": ["material risks identified", "claims cite evidence", "disposition is actionable"]
    }
  ]
}
